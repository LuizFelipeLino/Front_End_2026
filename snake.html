<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game Pro</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0f0c1b, #24173e);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.03);
      padding: 30px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(0, 255, 128, 0.5);
    }

    h2 {
      font-size: 1.2rem;
      color: #00ff88;
      margin-bottom: 15px;
    }

    #score {
      font-size: 1.5rem;
      font-weight: bold;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(20, 24px);
      grid-template-rows: repeat(20, 24px);
      gap: 2px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px;
      border-radius: 12px;
      border: 2px solid #332555;
      margin: 0 auto 20px auto;
    }

    .cell {
      width: 24px;
      height: 24px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 4px;
      transition: background 0.1s ease;
    }

    .snake {
      background: #00ff88;
      box-shadow: 0 0 8px #00ff88;
      border-radius: 6px;
    }

    /* Estilo especial para a cabeça da cobra */
    .snake-head {
      background: #00bfff;
      box-shadow: 0 0 12px #00bfff;
    }

    .food {
      background: #ff0055;
      box-shadow: 0 0 12px #ff0055;
      border-radius: 50%;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(0.9); }
      to { transform: scale(1.1); }
    }

    p {
      color: #8b82a7;
      font-size: 0.9rem;
    }

    #gameOver {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 12, 27, 0.85);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    #gameOver h2 {
      font-size: 3rem;
      color: #ff0055;
      text-shadow: 0 0 15px rgba(ff, 0, 55, 0.6);
      margin-bottom: 20px;
    }

    button {
      background: #00ff88;
      color: #0f0c1b;
      border: none;
      padding: 12px 30px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 5px 15px rgba(0, 255, 128, 0.4);
    }

    button:hover {
      background: #00bfff;
      box-shadow: 0 5px 15px rgba(0, 191, 255, 0.6);
      transform: translateY(-2px);
    }
    
    .wrapper {
      position: relative;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🐍 SNAKE</h1>
    <h2>Pontuação: <span id="score">0</span></h2>

    <div class="wrapper">
      <div id="gameOver" style="display:none;">
        <h2>Game Over!</h2>
        <button onclick="restartGame()">Jogar Novamente</button>
      </div>

      <div id="board"></div>
    </div>

    <p>Use as setas do teclado para guiar a cobra.</p>
  </div>

  <script>
    const BOARD_SIZE = 20;
    const boardElement = document.getElementById("board");
    const scoreElement = document.getElementById("score");
    const gameOverElement = document.getElementById("gameOver");

    let snake, direction, nextDirection, food, score, gameRunning, gameInterval;
    let cells = [];

    // OTIMIZAÇÃO: Cria a estrutura do tabuleiro apenas uma vez na inicialização
    function createBoard() {
      boardElement.innerHTML = "";
      cells = [];
      for (let row = 0; row < BOARD_SIZE; row++) {
        cells[row] = [];
        for (let col = 0; col < BOARD_SIZE; col++) {
          const cell = document.createElement("div");
          cell.classList.add("cell");
          boardElement.appendChild(cell);
          cells[row][col] = cell; // Guarda a referência do elemento
        }
      }
    }

    function randomFood() {
      let newFood;
      while (true) {
        newFood = {
          x: Math.floor(Math.random() * BOARD_SIZE),
          y: Math.floor(Math.random() * BOARD_SIZE)
        };
        // Garante que a comida não vai nascer em cima da cobra, olhar essa parte depois.
        const collision = snake.some(part => part.x === newFood.x && part.y === newFood.y);
        if (!collision) break;
      }
      return newFood;
    }

    function drawBoard() {
      for (let row = 0; row < BOARD_SIZE; row++) {
        for (let col = 0; col < BOARD_SIZE; col++) {
          cells[row][col].className = "cell"; // Limpa as classes anteriores
        }
      }

      // Desenha a cobra
      snake.forEach((part, index) => {
        if (index === 0) {
          cells[part.y][part.x].classList.add("snake", "snake-head"); // Cabeça
        } else {
          cells[part.y][part.x].classList.add("snake"); // Corpo
        }
      });

      // Desenha a comida
      cells[food.y][food.x].classList.add("food");
    }

    function moveSnake() {
      if (!gameRunning) return;

      direction = nextDirection; // Atualiza a direção confirmada
      const head = { ...snake[0] };

      switch (direction) {
        case "UP":    head.y--; break;
        case "DOWN":  head.y++; break;
        case "LEFT":  head.x--; break;
        case "RIGHT": head.x++; break;
      }

      // Colisão com as paredes
      if (head.x < 0 || head.x >= BOARD_SIZE || head.y < 0 || head.y >= BOARD_SIZE) {
        gameOver();
        return;
      }

      // Colisão consigo mesma
      if (snake.some(part => part.x === head.x && part.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      // Sistema de comer
      if (head.x === food.x && head.y === food.y) {
        score += 10; // Pontuação mais emocionante
        scoreElement.textContent = score;
        food = randomFood();
      } else {
        snake.pop();
      }

      drawBoard();
    }

    function gameOver() {
      gameRunning = false;
      clearInterval(gameInterval);
      gameOverElement.style.display = "flex";
    }

    function restartGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];

      direction = "RIGHT";
      nextDirection = "RIGHT";
      score = 0;
      scoreElement.textContent = score;
      food = randomFood();
      gameRunning = true;
      gameOverElement.style.display = "none";

      drawBoard();
      clearInterval(gameInterval);
      gameInterval = setInterval(moveSnake, 130); // Velocidade levemente ajustada para melhor jogabilidade
    }

    document.addEventListener("keydown", e => {
      if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
          e.preventDefault();
      }
      
      // OTIMIZAÇÃO: Usar o nextDirection impede que o jogador mude de direção 
      // duas vezes no mesmo frame e se suicide por acidente.
      switch (e.key) {
        case "ArrowUp":    if (direction !== "DOWN")  nextDirection = "UP"; break;
        case "ArrowDown":  if (direction !== "UP")    nextDirection = "DOWN"; break;
        case "ArrowLeft":  if (direction !== "RIGHT") nextDirection = "LEFT"; break;
        case "ArrowRight": if (direction !== "LEFT")  nextDirection = "RIGHT"; break;
      }
    });

    // Início do jogo
    createBoard();
    restartGame();
  </script>
</body>
</html>
